<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Deep Claim - play the prototype</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  canvas{display:block;margin:0 auto;touch-action:none}
</style>
<meta name="description" content="Deep Claim: a one-finger mining game. Early prototype - play in your browser.">
<meta property="og:title" content="Deep Claim - play the prototype">
<meta property="og:description" content="Dig down, sell ore, upgrade the drill. One finger. Early prototype.">
<style>
  #wl{position:fixed;z-index:10;display:none;transform:translateX(-50%);padding:9px 16px;border-radius:20px;
    background:#ffb21f;color:#1b1200;font:800 15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.5);white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   TUNING CONSTANTS - every number of the game lives here
   Depth is counted in tiles: the first underground row is depth 1.
   ===================================================================== */
const CFG = {
  // ---- field ----
  COLS: 12,
  ROWS: 200,
  MAX_ASPECT: 0.60,          // max canvas width / height (keeps portrait on desktop)

  // ---- ores: depth range (tiles), value per unit, vein count and vein size ----
  ORES: [
    { name: 'Coal',    min: 5,   max: 40,  value: 5,   color: '#1d1d24', shine: '#7d7d90', veins: 16, veinSize: [3, 6] },
    { name: 'Copper',  min: 20,  max: 80,  value: 15,  color: '#e2793a', shine: '#ffc08a', veins: 20, veinSize: [3, 6] },
    { name: 'Silver',  min: 60,  max: 120, value: 40,  color: '#d5dde8', shine: '#ffffff', veins: 18, veinSize: [3, 5] },
    { name: 'Gold',    min: 100, max: 170, value: 100, color: '#ffcf1f', shine: '#fff6b0', veins: 18, veinSize: [3, 5] },
    { name: 'Crystal', min: 150, max: 200, value: 300, color: '#55efff', shine: '#ffffff', veins: 12, veinSize: [2, 4] },
  ],

  // ---- cargo ----
  CARGO_START: 10,
  CARGO_PER_LEVEL: 5,

  // ---- fuel ----
  FUEL_START: 100,
  FUEL_PER_LEVEL: 35,        // extra tank per upgrade level
  FUEL_PER_DIG: 2.5,         // fuel for digging one solid tile
  FUEL_PER_MOVE: 0.5,        // fuel for moving through an already dug tile
  LOW_FUEL_FRAC: 0.15,       // blinking warning below this share of the tank
  CLOSE_CALL_FRAC: 0.10,     // "CLOSE CALL" banner if you surface below this share

  // ---- speed (seconds per tile) ----
  DIG_TIME: 0.30,
  MOVE_TIME: 0.09,
  CRAWL_TIME: 0.55,          // out of fuel: slow crawl upward
  OUT_OF_FUEL_CARGO_LOSS: 0.5, // share of cargo dropped when the tank runs dry (0 = no penalty)
  SPEED_PER_LEVEL: 1.25,     // speed multiplier per upgrade level
  HARDNESS_AT_BOTTOM: 3.5,   // dig time multiplier at the deepest row (1.0 at the top)
  ROCK_HARDNESS: 3.0,        // fallen rock is this much slower to dig

  // ---- shop ----
  UPGRADE_BASE: { speed: 140, cargo: 90, fuel: 110 },
  UPGRADE_GROWTH: 1.6,
  SHOP_PANEL_FRAC: 0.34,     // share of the screen height used by the shop panel

  // ---- hazard: gas pocket ----
  GAS_FROM: 40,
  GAS_CHANCE_START: 0.015,   // share of tiles that are gas at GAS_FROM
  GAS_CHANCE_END: 0.07,      // ... at the deepest row
  GAS_CARGO_LOSS: 0.4,       // share of cargo lost in an explosion

  // ---- hazard: cave-in ----
  CAVE_FROM: 90,
  CAVE_CHANCE_START: 0.03,   // chance per dug tile at CAVE_FROM
  CAVE_CHANCE_END: 0.15,     // ... at the deepest row
  CAVE_WARN: 0.9,            // seconds of warning before the rock drops
  CAVE_FALL_SPEED: 9,        // tiles per second
  CAVE_MAX_HEIGHT: 8,        // rock starts at most this many tiles above
  CAVE_CARGO_LOSS: 0.25,
  CAVE_FUEL_LOSS: 10,

  // ---- juice ----
  RECORD_STEP: 10,           // "NEW DEPTH RECORD" every N tiles of new depth
  DIG_PARTICLES_PER_SEC: 70,
  SHAKE_DIG: 1.5,
  SHAKE_ORE: 5,
  SHAKE_SELL: 9,
  SHAKE_EXPLOSION: 22,
  SHAKE_ROCK: 14,
  SHAKE_DECAY: 9,
  BANNER_TIME: 1.8,
  CAMERA_DRILL_FRAC: 0.36,   // vertical position of the drill on screen
  CAMERA_LERP: 10,

  // ---- controls ----
  DRAG_DEADZONE: 14,         // px before a drag counts as a direction
  JOY_RADIUS: 60,            // px, the anchor follows the finger beyond this

  // ---- sound ----
  VOLUME: 0.5,
};

/* ===================================================================== */
const COLS = CFG.COLS, ROWS = CFG.ROWS;
const T_EMPTY = 0, T_DIRT = 1, T_ROCK = 2, T_GAS = 3, T_ORE = 10;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, TS = 0, U = 1, DPR = 1;

const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const lerp = (a, b, k) => a + (b - a) * Math.max(0, Math.min(1, k));
const hash = (x, y) => (((x * 73856093) ^ (y * 19349663)) >>> 0) % 1000 / 1000;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  H = window.innerHeight;
  W = Math.min(window.innerWidth, Math.round(H * CFG.MAX_ASPECT));
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  TS = W / COLS; U = W / 375;
}
window.addEventListener('resize', resize);
resize();

/* ---------------- world ---------------- */
const world = new Uint8Array(COLS * ROWS);
const tile = (x, y) => (y < 0 ? T_EMPTY : world[y * COLS + x]);
const setTile = (x, y, t) => { if (y >= 0 && y < ROWS && x >= 0 && x < COLS) world[y * COLS + x] = t; };

function generate() {
  world.fill(T_DIRT);
  CFG.ORES.forEach((o, i) => {
    const y0 = o.min - 1, y1 = Math.min(o.max, ROWS) - 1;
    for (let v = 0; v < o.veins; v++) {
      let x = rint(0, COLS - 1), y = rint(y0, y1);
      const n = rint(o.veinSize[0], o.veinSize[1]);
      for (let k = 0, placed = 0; k < 40 && placed < n; k++) {
        if (y >= y0 && y <= y1 && world[y * COLS + x] === T_DIRT) { world[y * COLS + x] = T_ORE + i; placed++; }
        if (Math.random() < 0.5) x += Math.random() < 0.5 ? -1 : 1; else y += Math.random() < 0.5 ? -1 : 1;
        x = Math.max(0, Math.min(COLS - 1, x));
      }
    }
  });
  for (let y = CFG.GAS_FROM - 1; y < ROWS; y++) {
    const p = lerp(CFG.GAS_CHANCE_START, CFG.GAS_CHANCE_END, (y + 1 - CFG.GAS_FROM) / (ROWS - CFG.GAS_FROM));
    for (let x = 0; x < COLS; x++) if (world[y * COLS + x] === T_DIRT && Math.random() < p) world[y * COLS + x] = T_GAS;
  }
}

/* ---------------- state ---------------- */
const G = {
  time: 0, money: 0, moneyShown: 0,
  fuel: CFG.FUEL_START, cargo: [],
  lv: { speed: 0, cargo: 0, fuel: 0 },
  drill: { tx: Math.floor(COLS / 2), ty: -1, x: Math.floor(COLS / 2), y: -1, face: { x: 0, y: 1 }, move: null },
  camY: -8, record: 0, nextRecord: CFG.RECORD_STEP, dug: 0,
  particles: [], floats: [], rocks: [], timers: [], banners: [],
  shake: 0, flash: null, outOfFuel: false, seenOre: {}, firstOreTime: {}, digAcc: 0,
};
const fuelMax = () => CFG.FUEL_START + CFG.FUEL_PER_LEVEL * G.lv.fuel;
const cargoMax = () => CFG.CARGO_START + CFG.CARGO_PER_LEVEL * G.lv.cargo;
const speedMult = () => Math.pow(CFG.SPEED_PER_LEVEL, G.lv.speed);
const upCost = k => Math.round(CFG.UPGRADE_BASE[k] * Math.pow(CFG.UPGRADE_GROWTH, G.lv[k]));
const cargoValue = () => G.cargo.reduce((s, i) => s + CFG.ORES[i].value, 0);
const atSurface = () => G.drill.ty === -1 && !(G.drill.move && G.drill.move.ty >= 0);

/* ---------------- sound (WebAudio, 3 generated sounds) ---------------- */
let AC = null, noiseBuf = null;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function noise(dur, freq, vol) {
  if (!AC) return;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol * CFG.VOLUME, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t, Math.random() * 0.5, dur);
}
function tone(f0, f1, dur, vol, type, delay) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + (delay || 0);
  o.type = type || 'square'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol * CFG.VOLUME, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sndDig(ore) { noise(0.08, ore ? 2600 : rnd(700, 1300), 0.35); if (ore) tone(900, 1500, 0.09, 0.12, 'triangle'); }
function sndSell(pitch) { [523, 659, 784, 1047].forEach((f, i) => tone(f * (pitch || 1), f * (pitch || 1), 0.12, 0.18, 'square', i * 0.07)); }
function sndExplosion() { noise(0.8, 500, 1.0); tone(120, 30, 0.6, 0.6, 'sine'); }

/* ---------------- juice helpers ---------------- */
function burst(x, y, n, color, speed, life, size) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(0.3, 1) * speed;
    G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.3, life: rnd(0.5, 1) * life, max: life, color, size: rnd(0.5, 1) * (size || 0.16) });
  }
  if (G.particles.length > 900) G.particles.splice(0, G.particles.length - 900);
}
function floatText(text, x, y, color, size, dur) { G.floats.push({ text, x, y, color, size: size || 20, t: 0, dur: dur || 1.2 }); }
function banner(text, color) { G.banners.push({ text, color: color || '#fff', t: 0 }); if (G.banners.length > 3) G.banners.shift(); }
function flash(color, a) { G.flash = { color, a: a || 0.6 }; }
function shake(v) { G.shake = Math.max(G.shake, v * U); }
function after(t, fn) { G.timers.push({ t, fn }); }
const dirtRGB = (y, h) => {
  const k = Math.max(0, y) / ROWS, m = 0.88 + 0.24 * h;
  return [Math.round(lerp(142, 52, k) * m), Math.round(lerp(96, 40, k) * m), Math.round(lerp(60, 78, k) * m)];
};
const dirtColor = (y, h) => { const c = dirtRGB(y, h); return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; };

/* ---------------- input: one finger drag (+ arrow keys on desktop) ---------------- */
let ptr = null, autoDir = null;
const keys = {};
function evPos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  audioInit(); const p = evPos(e);
  ptr = { sx: p.x, sy: p.y, x: p.x, y: p.y, moved: false };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (!ptr) return; const p = evPos(e); ptr.x = p.x; ptr.y = p.y;
  const dx = ptr.x - ptr.sx, dy = ptr.y - ptr.sy, d = Math.hypot(dx, dy);
  if (d > CFG.DRAG_DEADZONE) ptr.moved = true;
  if (d > CFG.JOY_RADIUS) { ptr.sx = ptr.x - dx / d * CFG.JOY_RADIUS; ptr.sy = ptr.y - dy / d * CFG.JOY_RADIUS; }
});
function pointerEnd(e) { if (!ptr) return; if (!ptr.moved) tap(ptr.x, ptr.y); ptr = null; }
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', () => { ptr = null; });
window.addEventListener('keydown', e => { keys[e.key] = true; audioInit(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });
document.addEventListener('contextmenu', e => e.preventDefault());

function inputDir() {
  if (autoDir) return autoDir;
  if (keys.ArrowDown) return { x: 0, y: 1 }; if (keys.ArrowUp) return { x: 0, y: -1 };
  if (keys.ArrowLeft) return { x: -1, y: 0 }; if (keys.ArrowRight) return { x: 1, y: 0 };
  if (!ptr || !ptr.moved) return null;
  const dx = ptr.x - ptr.sx, dy = ptr.y - ptr.sy;
  if (Math.hypot(dx, dy) < CFG.DRAG_DEADZONE) return null;
  return Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) };
}

/* ---------------- shop ---------------- */
const UP_KEYS = ['speed', 'cargo', 'fuel'];
const UP_NAMES = { speed: 'DRILL SPEED', cargo: 'CARGO HOLD', fuel: 'FUEL TANK' };
function shopRects() {
  const ph = H * CFG.SHOP_PANEL_FRAC, py = H - ph, pad = 10 * U;
  const sell = { x: pad, y: py + pad, w: W - 2 * pad, h: ph * 0.34 };
  const bw = (W - 4 * pad) / 3, by = sell.y + sell.h + pad, bh = H - by - pad * 1.6;
  return { py, ph, sell, ups: UP_KEYS.map((k, i) => ({ k, x: pad + i * (bw + pad), y: by, w: bw, h: bh })) };
}
const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
function tap(x, y) {
  if (!atSurface()) return;
  const s = shopRects();
  if (inRect(s.sell, x, y)) return sellCargo();
  for (const b of s.ups) if (inRect(b, x, y)) return buyUpgrade(b.k, b);
}
function sellCargo() {
  if (!G.cargo.length) return;
  const full = G.cargo.length >= cargoMax(), total = cargoValue();
  const groups = {}; G.cargo.forEach(i => { groups[i] = (groups[i] || 0) + 1; });
  const d = G.drill, sx = (d.x + 0.5) * TS, sy = (d.y - G.camY) * TS;
  Object.keys(groups).forEach((k, n) => {
    const o = CFG.ORES[k], sum = o.value * groups[k];
    after(n * 0.16, () => {
      floatText('+$' + sum, sx + rnd(-60, 60) * U, sy - 10 * U - n * 6 * U, o.value >= 100 ? '#ffe14a' : '#7dff8a', (22 + Math.min(18, sum / 40)) * U, 1.5);
      burst(d.x + 0.5, d.y + 0.3, 14, '#ffd84a', 6, 0.9, 0.2);
      sndSell(1 + n * 0.12);
    });
  });
  G.money += total; G.cargo = [];
  shake(full ? CFG.SHAKE_SELL : CFG.SHAKE_SELL * 0.5);
  if (full) { flash('#ffe14a', 0.45); banner('FULL LOAD  +$' + total, '#ffe14a'); burst(d.x + 0.5, d.y + 0.3, 60, '#ffd84a', 10, 1.3, 0.24); }
}
function buyUpgrade(k, r) {
  const c = upCost(k);
  if (G.money < c) { floatText('NEED $' + c, r.x + r.w / 2, r.y, '#ff6a5a', 16 * U, 0.9); return; }
  G.money -= c; G.lv[k]++;
  if (k === 'fuel') G.fuel = fuelMax();
  flash('#ffffff', 0.75); shake(CFG.SHAKE_SELL);
  banner(UP_NAMES[k] + '  LV ' + (G.lv[k] + 1), '#8fe9ff');
  burst(G.drill.x + 0.5, G.drill.y + 0.5, 50, '#8fe9ff', 9, 1.1, 0.2);
  sndSell(1.5);
}

/* ---------------- drill logic ---------------- */
function hardness(y, t) {
  return lerp(1, CFG.HARDNESS_AT_BOTTOM, y / (ROWS - 1)) * (t === T_ROCK ? CFG.ROCK_HARDNESS : 1);
}
function tryStartMove() {
  const d = G.drill;
  const out = G.fuel <= 0 && d.ty >= 0;
  let dir = out ? { x: 0, y: -1 } : inputDir();
  if (!dir) return;
  d.face = dir;
  const nx = d.tx + dir.x, ny = d.ty + dir.y;
  if (nx < 0 || nx >= COLS || ny < -1 || ny >= ROWS) return;
  const t = tile(nx, ny), solid = t !== T_EMPTY;
  let dur;
  if (out) dur = CFG.CRAWL_TIME;
  else if (solid) dur = CFG.DIG_TIME * hardness(ny, t) / speedMult();
  else dur = CFG.MOVE_TIME / speedMult();
  if (!out && (ny >= 0 || d.ty >= 0)) {
    G.fuel = Math.max(0, G.fuel - (solid ? CFG.FUEL_PER_DIG : CFG.FUEL_PER_MOVE));
    if (G.fuel <= 0 && ny >= 0 && !G.outOfFuel) { G.outOfFuel = true; banner('OUT OF FUEL - CRAWLING UP', '#ff5a4a'); shake(8);
      const n = loseCargo(CFG.OUT_OF_FUEL_CARGO_LOSS);
      if (n) floatText('-' + n + ' CARGO', (d.x + 0.5) * TS, (d.y - G.camY) * TS, '#ff5a4a', 24 * U, 1.6); }
  }
  d.move = { fx: d.tx, fy: d.ty, tx: nx, ty: ny, t: 0, dur, dig: solid, type: t };
  if (solid) sndDig(t >= T_ORE);
}
function finishMove(m) {
  const d = G.drill, wasBelow = m.fy >= 0;
  d.tx = m.tx; d.ty = m.ty; d.x = m.tx; d.y = m.ty; d.move = null;
  if (m.ty >= 0) setTile(m.tx, m.ty, T_EMPTY);
  if (m.dig) {
    G.dug++;
    const t = m.type, cx = m.tx + 0.5, cy = m.ty + 0.5;
    if (t >= T_ORE) collectOre(t - T_ORE, cx, cy);
    else if (t === T_GAS) explode(m.tx, m.ty);
    else shake(CFG.SHAKE_DIG);
    burst(cx, cy, 8, dirtColor(m.ty, 0.5), 4, 0.6, 0.18);
    if (m.fy <= m.ty) maybeCaveIn();
  }
  const depth = d.ty + 1;
  if (depth > G.record) {
    G.record = depth;
    if (depth >= G.nextRecord) {
      G.nextRecord = Math.floor(depth / CFG.RECORD_STEP) * CFG.RECORD_STEP + CFG.RECORD_STEP;
      banner('NEW DEPTH RECORD  ' + depth, '#ffffff'); flash('#ffffff', 0.25);
    }
  }
  if (d.ty === -1 && wasBelow) arriveSurface();
}
function collectOre(i, cx, cy) {
  const o = CFG.ORES[i], sx = cx * TS, sy = (cy - G.camY) * TS;
  burst(cx, cy, 16, o.color, 6, 0.8, 0.2); burst(cx, cy, 8, o.shine, 7, 0.6, 0.12);
  shake(CFG.SHAKE_ORE);
  if (G.cargo.length < cargoMax()) {
    G.cargo.push(i);
    floatText('+' + o.name, sx, sy - 8 * U, o.shine, 15 * U, 0.8);
    if (G.cargo.length === cargoMax()) floatText('CARGO FULL', sx, sy - 30 * U, '#ffb347', 20 * U, 1.4);
  } else floatText('CARGO FULL', sx, sy - 8 * U, '#ff6a5a', 18 * U, 1.0);
  if (!G.seenOre[i]) {
    G.seenOre[i] = true; G.firstOreTime[i] = G.time;
    banner('FIRST ' + o.name.toUpperCase() + ' VEIN!', o.shine); flash(o.color, 0.4);
    burst(cx, cy, 50, o.shine, 10, 1.2, 0.2); shake(CFG.SHAKE_SELL);
  }
}
function loseCargo(frac) {
  const n = Math.ceil(G.cargo.length * frac);
  for (let i = 0; i < n; i++) G.cargo.splice(rint(0, G.cargo.length - 1), 1);
  return n;
}
function explode(x, y) {
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const xx = x + dx, yy = y + dy;
    if (xx < 0 || xx >= COLS || yy < 0 || yy >= ROWS) continue;
    const t = tile(xx, yy);
    if (t !== T_EMPTY && t < T_ORE) setTile(xx, yy, T_EMPTY);
  }
  const n = loseCargo(CFG.GAS_CARGO_LOSS);
  shake(CFG.SHAKE_EXPLOSION); flash('#ff8a2a', 0.7); sndExplosion();
  burst(x + 0.5, y + 0.5, 70, '#ff9a2a', 12, 1.1, 0.26); burst(x + 0.5, y + 0.5, 40, '#fff0a0', 8, 0.7, 0.18);
  burst(x + 0.5, y + 0.5, 30, '#444', 6, 1.5, 0.3);
  banner('GAS POCKET!', '#ff8a2a');
  if (n) floatText('-' + n + ' CARGO', (x + 0.5) * TS, (y - G.camY) * TS, '#ff5a4a', 24 * U, 1.6);
}
function maybeCaveIn() {
  const d = G.drill, depth = d.ty + 1;
  if (depth < CFG.CAVE_FROM || G.rocks.length) return;
  const p = lerp(CFG.CAVE_CHANCE_START, CFG.CAVE_CHANCE_END, (depth - CFG.CAVE_FROM) / (ROWS - CFG.CAVE_FROM));
  if (Math.random() >= p) return;
  let y = d.ty - 1; if (y < 0) return;
  const t = tile(d.tx, y);
  if (t >= T_ORE || t === T_GAS) return;
  if (t !== T_EMPTY) setTile(d.tx, y, T_EMPTY);            // the ceiling breaks loose
  else { let n = 0; while (y - 1 >= 0 && tile(d.tx, y - 1) === T_EMPTY && n < CFG.CAVE_MAX_HEIGHT) { y--; n++; } }
  G.rocks.push({ x: d.tx, y, warn: CFG.CAVE_WARN });
  noise(0.5, 220, 0.5);
}
function updateRocks(dt) {
  const d = G.drill;
  for (let i = G.rocks.length - 1; i >= 0; i--) {
    const r = G.rocks[i];
    if (r.warn > 0) { r.warn -= dt; if (Math.random() < dt * 30) burst(r.x + rnd(0.1, 0.9), r.y + 1, 1, '#998', 1.5, 0.5, 0.1); continue; }
    r.y += CFG.CAVE_FALL_SPEED * dt;
    if (Math.abs(d.x - r.x) < 0.5 && r.y >= d.y - 0.8 && r.y <= d.y + 0.5) {       // hit the drill
      const n = loseCargo(CFG.CAVE_CARGO_LOSS);
      G.fuel = Math.max(0, G.fuel - CFG.CAVE_FUEL_LOSS);
      shake(CFG.SHAKE_ROCK); flash('#ff3a2a', 0.5); sndExplosion();
      burst(r.x + 0.5, d.y, 40, '#8a8a92', 9, 1.0, 0.24);
      banner('CAVE-IN!', '#ff5a4a');
      floatText((n ? '-' + n + ' CARGO  ' : '') + '-' + CFG.CAVE_FUEL_LOSS + ' FUEL', (r.x + 0.5) * TS, (d.y - G.camY) * TS, '#ff5a4a', 20 * U, 1.6);
      G.rocks.splice(i, 1); continue;
    }
    const below = Math.ceil(r.y);
    if (below >= ROWS || tile(r.x, below) !== T_EMPTY) {                           // landed
      const row = below - 1;
      if (row >= 0 && !(d.tx === r.x && d.ty === row)) setTile(r.x, row, T_ROCK);
      shake(CFG.SHAKE_ROCK * 0.5); noise(0.25, 300, 0.6);
      burst(r.x + 0.5, row + 0.8, 18, '#8a8a92', 5, 0.7, 0.2);
      G.rocks.splice(i, 1);
    }
  }
}
function arriveSurface() {
  const frac = G.fuel / fuelMax();
  if (G.outOfFuel) banner('RESCUED - TANK REFILLED', '#8fe9ff');
  else if (frac < CFG.CLOSE_CALL_FRAC) { banner('CLOSE CALL!', '#7dff8a'); flash('#7dff8a', 0.4); shake(CFG.SHAKE_SELL); burst(G.drill.x + 0.5, -0.5, 50, '#7dff8a', 9, 1.2, 0.2); }
  G.fuel = fuelMax(); G.outOfFuel = false;
}

/* ---------------- update ---------------- */
function update(dt) {
  G.time += dt;
  const d = G.drill;
  if (d.move) {
    const m = d.move; m.t += dt;
    const k = Math.min(1, m.t / m.dur);
    d.x = m.fx + (m.tx - m.fx) * k; d.y = m.fy + (m.ty - m.fy) * k;
    if (m.dig) {
      G.digAcc += dt * CFG.DIG_PARTICLES_PER_SEC;
      while (G.digAcc >= 1) {
        G.digAcc--;
        const o = m.type >= T_ORE ? CFG.ORES[m.type - T_ORE] : null;
        const px = d.x + 0.5 + d.face.x * 0.5 + rnd(-0.3, 0.3), py = d.y + 0.5 + d.face.y * 0.5 + rnd(-0.3, 0.3);
        G.particles.push({ x: px, y: py, vx: -d.face.x * rnd(1, 5) + rnd(-2, 2), vy: -d.face.y * rnd(1, 5) + rnd(-3, 1),
          life: rnd(0.3, 0.7), max: 0.7, color: o && Math.random() < 0.5 ? o.color : dirtColor(m.ty, Math.random()), size: rnd(0.08, 0.2) });
      }
      G.shake = Math.max(G.shake, CFG.SHAKE_DIG * U * 0.6);
    }
    if (k >= 1) finishMove(m);
  }
  if (!d.move) tryStartMove();
  updateRocks(dt);

  for (let i = G.timers.length - 1; i >= 0; i--) { const t = G.timers[i]; t.t -= dt; if (t.t <= 0) { G.timers.splice(i, 1); t.fn(); } }
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i]; p.life -= dt;
    if (p.life <= 0) { G.particles.splice(i, 1); continue; }
    p.vy += 14 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = G.floats.length - 1; i >= 0; i--) { const f = G.floats[i]; f.t += dt; f.y -= 46 * U * dt; if (f.t >= f.dur) G.floats.splice(i, 1); }
  if (G.banners.length) { G.banners[0].t += dt; if (G.banners[0].t > CFG.BANNER_TIME / (G.banners.length > 1 ? 2 : 1)) G.banners.shift(); }
  G.shake *= Math.exp(-dt * CFG.SHAKE_DECAY); if (G.shake < 0.2) G.shake = 0;
  if (G.flash) { G.flash.a -= dt * 2.2; if (G.flash.a <= 0) G.flash = null; }
  G.moneyShown += (G.money - G.moneyShown) * Math.min(1, dt * 7);
  if (Math.abs(G.money - G.moneyShown) < 0.6) G.moneyShown = G.money;
  const rowsOnScreen = H / TS, target = Math.max(-rowsOnScreen * CFG.CAMERA_DRILL_FRAC - 1, d.y - rowsOnScreen * CFG.CAMERA_DRILL_FRAC);
  G.camY += (target - G.camY) * Math.min(1, dt * CFG.CAMERA_LERP);
}

/* ---------------- draw ---------------- */
function txt(s, x, y, size, color, align, stroke) {
  ctx.font = '800 ' + Math.round(size) + 'px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = Math.max(2, size * 0.16); ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawTile(t, x, y, px, py) {
  const h = hash(x, y), s = TS + 0.6;
  if (t === T_EMPTY) { const c = dirtRGB(y, 0.5); ctx.fillStyle = 'rgb(' + (c[0] * 0.28 | 0) + ',' + (c[1] * 0.28 | 0) + ',' + (c[2] * 0.3 | 0) + ')'; ctx.fillRect(px, py, s, s); return; }
  ctx.fillStyle = dirtColor(y, h); ctx.fillRect(px, py, s, s);
  if (t === T_ROCK) {
    ctx.fillStyle = '#7a7a84'; rr(px + TS * 0.06, py + TS * 0.06, TS * 0.88, TS * 0.88, TS * 0.22); ctx.fill();
    ctx.fillStyle = '#9a9aa6'; ctx.fillRect(px + TS * 0.22, py + TS * 0.2, TS * 0.3, TS * 0.14);
  } else if (t === T_GAS) {
    ctx.fillStyle = 'rgba(150,255,90,' + (0.2 + 0.1 * Math.sin(G.time * 3 + h * 9)) + ')';
    ctx.beginPath(); ctx.arc(px + TS * (0.3 + h * 0.2), py + TS * 0.4, TS * 0.16, 0, 7); ctx.arc(px + TS * 0.68, py + TS * (0.5 + h * 0.2), TS * 0.11, 0, 7); ctx.fill();
  } else if (t >= T_ORE) {
    const o = CFG.ORES[t - T_ORE];
    ctx.fillStyle = o.color;
    ctx.fillRect(px + TS * (0.12 + h * 0.1), py + TS * 0.14, TS * 0.36, TS * 0.32);
    ctx.fillRect(px + TS * 0.52, py + TS * (0.3 + h * 0.12), TS * 0.34, TS * 0.3);
    ctx.fillRect(px + TS * (0.2 + h * 0.15), py + TS * 0.58, TS * 0.3, TS * 0.28);
    const tw = 0.5 + 0.5 * Math.sin(G.time * 4 + h * 40);
    ctx.globalAlpha = 0.35 + 0.65 * tw; ctx.fillStyle = o.shine;
    ctx.fillRect(px + TS * (0.18 + h * 0.1), py + TS * 0.18, TS * 0.12, TS * 0.1);
    ctx.fillRect(px + TS * 0.62, py + TS * (0.36 + h * 0.12), TS * 0.1, TS * 0.1);
    ctx.globalAlpha = 1;
  }
}
function drawWorld() {
  const cam = G.camY;
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, Math.max(1, -cam * TS));
  g.addColorStop(0, '#3a6ea8'); g.addColorStop(1, '#ffd9a0');
  ctx.fillStyle = cam < 0 ? g : '#000'; ctx.fillRect(0, 0, W, H);
  if (cam < 0) {
    const gy = -cam * TS;
    ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(W * 0.8, gy - TS * 5, TS * 0.9, 0, 7); ctx.fill();
    // shop building
    ctx.fillStyle = '#7a4a2a'; ctx.fillRect(TS * 0.6, gy - TS * 2.2, TS * 3.2, TS * 2.2);
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(TS * 0.3, gy - TS * 2.2); ctx.lineTo(TS * 2.2, gy - TS * 3.3); ctx.lineTo(TS * 4.1, gy - TS * 2.2); ctx.fill();
    ctx.fillStyle = '#ffe9a8'; ctx.fillRect(TS * 1.0, gy - TS * 1.7, TS * 2.4, TS * 0.7);
    txt('SHOP', TS * 2.2, gy - TS * 1.34, TS * 0.52, '#5a2d12');
    ctx.fillStyle = '#4c9a3a'; ctx.fillRect(0, gy - TS * 0.12, W, TS * 0.14);
  }
  const r0 = Math.max(0, Math.floor(cam)), r1 = Math.min(ROWS - 1, Math.ceil(cam + H / TS));
  for (let y = r0; y <= r1; y++) for (let x = 0; x < COLS; x++) drawTile(world[y * COLS + x], x, y, x * TS, (y - cam) * TS);
  if (r1 >= ROWS - 1) { ctx.fillStyle = '#111'; ctx.fillRect(0, (ROWS - cam) * TS, W, H); }
}
function drawRocks() {
  for (const r of G.rocks) {
    const warn = r.warn > 0, jx = warn ? rnd(-1, 1) * TS * 0.06 : 0;
    const px = r.x * TS + jx, py = (r.y - G.camY) * TS;
    if (warn && Math.sin(G.time * 30) > 0) {
      ctx.fillStyle = 'rgba(255,50,40,0.22)'; ctx.fillRect(r.x * TS, py, TS, (G.drill.y - r.y + 1) * TS);
      txt('!', px + TS / 2, py + TS * 1.6, TS * 1.2, '#ff3a2a', 'center', true);
    }
    ctx.fillStyle = '#6f6f7a'; rr(px + TS * 0.05, py + TS * 0.05, TS * 0.9, TS * 0.9, TS * 0.25); ctx.fill();
    ctx.fillStyle = '#9a9aa6'; ctx.fillRect(px + TS * 0.22, py + TS * 0.2, TS * 0.3, TS * 0.14);
  }
}
function drawDrill() {
  const d = G.drill, dig = d.move && d.move.dig;
  const cx = (d.x + 0.5) * TS + (dig ? rnd(-1, 1) * TS * 0.04 : 0), cy = (d.y + 0.5 - G.camY) * TS + (dig ? rnd(-1, 1) * TS * 0.04 : 0);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(d.face.y, d.face.x));
  // drill bit (points along +x)
  const spin = Math.sin(G.time * 40) * 0.5 + 0.5;
  ctx.fillStyle = '#b8bcc6'; ctx.beginPath(); ctx.moveTo(TS * 0.2, -TS * 0.3); ctx.lineTo(TS * 0.56, 0); ctx.lineTo(TS * 0.2, TS * 0.3); ctx.fill();
  ctx.strokeStyle = '#5d616b'; ctx.lineWidth = Math.max(1, TS * 0.05);
  for (let i = 0; i < 3; i++) { const k = ((i + (dig ? spin : 0)) / 3); const x = TS * (0.22 + k * 0.3), hgt = TS * 0.3 * (1 - k * 0.95); ctx.beginPath(); ctx.moveTo(x, -hgt); ctx.lineTo(x, hgt); ctx.stroke(); }
  // body
  ctx.fillStyle = G.outOfFuel ? '#8a8f99' : '#ffb21f'; rr(-TS * 0.38, -TS * 0.34, TS * 0.62, TS * 0.68, TS * 0.12); ctx.fill();
  ctx.fillStyle = '#2b3a55'; ctx.fillRect(-TS * 0.12, -TS * 0.2, TS * 0.22, TS * 0.4);
  ctx.fillStyle = '#333'; ctx.fillRect(-TS * 0.4, -TS * 0.42, TS * 0.6, TS * 0.1); ctx.fillRect(-TS * 0.4, TS * 0.32, TS * 0.6, TS * 0.1);
  ctx.restore();
}
function drawHUD() {
  const pad = 10 * U, low = G.fuel / fuelMax() < CFG.LOW_FUEL_FRAC && G.drill.ty >= 0;
  ctx.fillStyle = 'rgba(8,10,18,0.72)'; ctx.fillRect(0, 0, W, 84 * U);
  txt('$' + Math.round(G.moneyShown), pad, 22 * U, 26 * U, '#ffe14a', 'left', true);
  txt('DEPTH ' + Math.max(0, Math.round(G.drill.y + 1)), W - pad, 22 * U, 20 * U, '#fff', 'right', true);
  const bw = (W - pad * 3) / 2, by = 46 * U, bh = 24 * U;
  const bar = (x, frac, col, label) => {
    ctx.fillStyle = '#20242e'; rr(x, by, bw, bh, 6 * U); ctx.fill();
    if (frac > 0.01) { ctx.fillStyle = col; rr(x, by, Math.max(bh * 0.5, bw * Math.min(1, frac)), bh, 6 * U); ctx.fill(); }
    txt(label, x + bw / 2, by + bh / 2 + 1, 13 * U, '#fff', 'center', true);
  };
  const blink = Math.sin(G.time * 14) > 0;
  bar(pad, G.fuel / fuelMax(), low ? (blink ? '#ff3a2a' : '#7a1a12') : '#3fb7ff', 'FUEL ' + Math.ceil(G.fuel) + '/' + fuelMax());
  const full = G.cargo.length >= cargoMax();
  bar(pad * 2 + bw, G.cargo.length / cargoMax(), full ? '#ff9a2a' : '#5fd068', 'CARGO ' + G.cargo.length + '/' + cargoMax());
  if (low) {
    const a = blink ? 0.35 : 0.12;
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.72);
    g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, 'rgba(255,20,10,' + a + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (blink) txt(G.outOfFuel ? 'OUT OF FUEL' : 'LOW FUEL - GO UP!', W / 2, 106 * U, 24 * U, '#ff4a3a', 'center', true);
  }
}
function drawShop() {
  if (!atSurface()) return;
  const s = shopRects();
  ctx.fillStyle = 'rgba(14,16,26,0.92)'; ctx.fillRect(0, s.py, W, s.ph);
  ctx.fillStyle = '#ffb21f'; ctx.fillRect(0, s.py, W, 3 * U);
  const val = cargoValue(), has = G.cargo.length > 0, pulse = has ? 1 + 0.03 * Math.sin(G.time * 8) : 1;
  ctx.save(); ctx.translate(s.sell.x + s.sell.w / 2, s.sell.y + s.sell.h / 2); ctx.scale(pulse, pulse);
  ctx.fillStyle = has ? '#2fbf5a' : '#2a2f3a'; rr(-s.sell.w / 2, -s.sell.h / 2, s.sell.w, s.sell.h, 12 * U); ctx.fill();
  txt(has ? 'SELL CARGO  +$' + val : 'CARGO EMPTY', 0, 1, 24 * U, has ? '#fff' : '#69707e', 'center', has);
  ctx.restore();
  for (const b of s.ups) {
    const c = upCost(b.k), ok = G.money >= c;
    ctx.fillStyle = ok ? '#2a6fd6' : '#232836'; rr(b.x, b.y, b.w, b.h, 10 * U); ctx.fill();
    if (ok) { ctx.strokeStyle = 'rgba(255,255,255,' + (0.4 + 0.3 * Math.sin(G.time * 6)) + ')'; ctx.lineWidth = 2 * U; rr(b.x, b.y, b.w, b.h, 10 * U); ctx.stroke(); }
    const cx = b.x + b.w / 2, col = ok ? '#fff' : '#7a8190';
    txt(UP_NAMES[b.k], cx, b.y + b.h * 0.2, 12.5 * U, col);
    txt('LV ' + (G.lv[b.k] + 1), cx, b.y + b.h * 0.47, 20 * U, col);
    txt('$' + c, cx, b.y + b.h * 0.78, 18 * U, ok ? '#ffe14a' : '#8c7a3a');
  }
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (G.shake) ctx.translate(rnd(-1, 1) * G.shake, rnd(-1, 1) * G.shake);
  drawWorld(); drawRocks(); drawDrill();
  for (const p of G.particles) {
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.6); ctx.fillStyle = p.color;
    const s = p.size * TS; ctx.fillRect(p.x * TS - s / 2, (p.y - G.camY) * TS - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  // start hint: a bouncing arrow under the drill until the first dig
  if (G.dug === 0 && !G.drill.move) {
    const cx = (G.drill.x + 0.5) * TS, cy = (G.drill.y + 1.9 - G.camY) * TS + Math.sin(G.time * 6) * TS * 0.25;
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.moveTo(cx - TS * 0.5, cy - TS * 0.3); ctx.lineTo(cx + TS * 0.5, cy - TS * 0.3); ctx.lineTo(cx, cy + TS * 0.4); ctx.fill();
  }
  ctx.restore();
  drawShop(); drawHUD();
  for (const f of G.floats) {
    const k = f.t / f.dur, pop = Math.min(1, f.t * 10);
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    txt(f.text, Math.max(50 * U, Math.min(W - 50 * U, f.x)), f.y, f.size * (0.6 + 0.4 * pop), f.color, 'center', true);
  }
  ctx.globalAlpha = 1;
  if (G.banners.length) {
    const b = G.banners[0], inK = Math.min(1, b.t * 7), s = 1 + (1 - inK) * 0.8 + 0.03 * Math.sin(G.time * 12);
    let size = 30 * U; ctx.font = '800 ' + size + 'px system-ui,sans-serif';
    ctx.save(); ctx.translate(W / 2, 150 * U); ctx.scale(s, s);
    ctx.font = '800 ' + Math.round(size) + 'px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
    const tw = ctx.measureText(b.text).width; if (tw > W * 0.9) size *= W * 0.9 / tw;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(-W * 0.48, -size * 0.85, W * 0.96, size * 1.7, 10 * U); ctx.fill();
    txt(b.text, 0, 1, size, b.color, 'center', true);
    ctx.restore();
  }
  if (ptr && ptr.moved) {
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ptr.sx, ptr.sy, CFG.JOY_RADIUS, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 20, 0, 7); ctx.fill();
  }
  if (G.flash) { ctx.globalAlpha = Math.max(0, G.flash.a); ctx.fillStyle = G.flash.color; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

/* ---------------- main loop ---------------- */
generate();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// debug handle for tuning from the console
window.DBG = { G, CFG, world, update, tap, shopRects, tile, setDir(d) { autoDir = d; } };
</script>
