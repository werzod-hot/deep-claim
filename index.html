<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Deep Claim - play the prototype</title>
<meta name="description" content="Deep Claim: a one-finger mining game. Early prototype - play in your browser.">
<meta property="og:title" content="Deep Claim - play the prototype">
<meta property="og:description" content="Dig down, sell ore, upgrade the drill. One finger. Early prototype.">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  canvas{display:block;margin:0 auto;touch-action:none}
  #wl{position:fixed;z-index:10;display:none;transform:translateX(-50%);padding:9px 16px;border-radius:20px;
    background:#ffb21f;color:#1b1200;font:800 15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.5);white-space:nowrap}
  #ad{position:fixed;z-index:10;display:none;transform:translateX(-50%);padding:9px 16px;border-radius:20px;border:0;cursor:pointer;
    background:#3ddc84;color:#06210f;font:800 15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    box-shadow:0 2px 10px rgba(0,0,0,.5);white-space:nowrap}
  #ad small{display:inline-block;margin-right:7px;padding:2px 6px;border-radius:8px;background:#06210f;color:#3ddc84;font-size:11px;vertical-align:1px}
  #adov{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:#05070d;color:#fff;text-align:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #adov b{font-size:34px;letter-spacing:2px}
  #adov p{max-width:300px;margin:18px 0 28px;font-size:16px;line-height:1.4;color:#b8bfcc}
  #adov span{font-size:56px;font-weight:800;color:#3ddc84}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="wl" target="_blank" rel="noopener">Like it? Join the waitlist &rarr;</a>
<button id="ad" type="button"></button>
<div id="adov"><b>AD PLACEHOLDER</b><p>In the full game a short video plays here. For now it's free - thanks for testing!</p><span id="adcount"></span></div>
<!-- order matters: later files use what earlier ones define -->
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/input.js"></script>
<script src="js/sim.js"></script>
<script src="js/progress.js"></script>
<script src="js/art.js"></script>
<script src="js/render.js"></script>
<script src="js/ads.js"></script>
<script src="js/save.js"></script>
<script src="js/analytics.js"></script>
<script src="js/main.js"></script>
</body>
</html>
